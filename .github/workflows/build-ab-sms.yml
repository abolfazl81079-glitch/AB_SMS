name: Build AB/SMS APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build AB/SMS APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Generate or Restore Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -alias absms -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass absms2026 -keypass absms2026 -dname "CN=ABSMS, OU=Security, O=ABSMS, L=Tehran, ST=Tehran, C=IR"
          fi

      - name: Build APK (Release & Debug)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'absms2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'absms2026' }}
          KEY_ALIAS: "absms"
        run: |
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Package AB/SMS Release APK
        id: package
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output/AB_SMS_v1.0.0.apk
          elif [ -f app/build/outputs/apk/release/*.apk ]; then
            cp app/build/outputs/apk/release/*.apk output/AB_SMS_v1.0.0.apk
          else
            cp app/build/outputs/apk/debug/*.apk output/AB_SMS_v1.0.0.apk
          fi
          
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/AB_SMS_v1.0.0_debug.apk
          fi

          sha=$(sha256sum output/AB_SMS_v1.0.0.apk | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "=========================================="
          echo "AB/SMS Build Succeeded!"
          echo "APK: AB_SMS_v1.0.0.apk"
          echo "SHA-256: $sha"
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AB_SMS_v1.0.0_APK
          path: output/
          retention-days: 30
